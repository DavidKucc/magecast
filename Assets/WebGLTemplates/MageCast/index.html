<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!--
      The game fills the browser window. Unity's default template draws a fixed 1280 x 720 canvas
      with a footer under it, centred on the page -- in a 720-high window that pushed the top of the
      game off the screen, and the room code lives at the top.
    -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #121318; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #121318; outline: none; }
      #loading {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        color: #f2d27a; font: 700 28px system-ui, "Segoe UI", sans-serif; letter-spacing: 2px; text-align: center;
      }
      #loading small { display: block; margin-top: 8px; font-weight: 400; font-size: 13px; letter-spacing: 0; color: #9a9ca8; }
      #bar { width: 280px; height: 6px; margin: 16px auto 0; background: #2a2c36; border-radius: 3px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #e0a93e; }
      #error { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
               max-width: 560px; padding: 16px 20px; background: #3a1616; color: #ffd6d6;
               font: 15px system-ui, sans-serif; border-radius: 6px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">MAGE CAST<small>loading...</small><div id="bar"><div id="fill"></div></div></div>
    <div id="error"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#fill");
      var errorBox = document.querySelector("#error");

      function showBanner(msg, type) {
        if (type == "error") { errorBox.textContent = msg; errorBox.style.display = "block"; }
        else console.warn(msg);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
      };

      // the right mouse button draws runes; the page menu must not open over the game
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          loading.style.display = "none";
          window.unityInstance = unityInstance;   // lets the page (or a test) talk to the game
          canvas.focus();
        }).catch(function (message) {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
